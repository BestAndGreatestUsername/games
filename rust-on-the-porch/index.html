<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust on the Porch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#070504;--ink:#f4ece4;--dim:#c9b4a2;--rust:#e06a1f;--line:rgba(224,106,31,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 600px at 50% 110%,rgba(224,106,31,.22),transparent 60%),var(--bg);color:var(--ink);font:15px/1.55 "Inter",system-ui,sans-serif;display:grid;place-items:center;padding:32px 16px}
main{width:min(960px,100%);display:grid;gap:18px}
a{color:var(--dim)}
.back{font-weight:600;font-size:13px;text-decoration:none}
.back:hover{color:var(--ink)}
h1{margin:0;font:400 clamp(36px,7vw,64px)/1 "Rye",serif;text-shadow:0 0 28px rgba(224,106,31,.55)}
.eyebrow{font:700 11px/1 "Inter";letter-spacing:.22em;text-transform:uppercase;color:var(--rust)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000 url("../shots/rust-on-the-porch.jpg") center/contain no-repeat;box-shadow:0 30px 80px -30px rgba(224,106,31,.6)}
video{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.go{font:700 16px/1 "Inter";letter-spacing:.08em;text-transform:uppercase;padding:16px 26px;border-radius:14px;border:0;background:var(--rust);color:#1a0a02;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.5)}
.go:hover{filter:brightness(1.1)}
.go:disabled{opacity:.7;cursor:default}
.bar{position:absolute;left:24px;right:24px;bottom:24px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--rust);transition:width .2s}
.note{margin:0;color:var(--dim);font-size:13.5px}
.go:focus-visible,a:focus-visible{outline:2px solid var(--rust);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="back" href="../">‹ Game Shelf</a>
  <div><div class="eyebrow">Music video</div><h1>Rust on the Porch</h1></div>
  <div class="stage">
    <video id="v" controls playsinline preload="metadata" poster="../shots/rust-on-the-porch.jpg"></video>
    <div class="cover" id="cover"><button class="go" id="go" type="button">▶ Play the video</button></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
  </div>
  <p class="note" id="note">The video is 195 MB, so it loads fully before it plays. On a phone, Wi-Fi is a good idea.</p>
</main>
<script>
const PARTS = ["part1.bin", "part2.bin", "part3.bin", "part4.bin"];
const TOTAL = 195517398;
const MUTE = new URLSearchParams(location.search).has("mute");
const v = document.getElementById("v"), go = document.getElementById("go"), note = document.getElementById("note");
const bar = document.getElementById("bar"), fill = document.getElementById("fill"), cover = document.getElementById("cover");
let url = null;
async function load() {
  go.disabled = true; bar.style.display = "block";
  const chunks = []; let got = 0;
  for (const p of PARTS) {
    const r = await fetch(p);
    if (!r.ok) throw new Error(p + ": HTTP " + r.status);
    const reader = r.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      const pct = Math.min(100, (got / TOTAL) * 100);
      fill.style.width = pct + "%";
      go.textContent = "Loading " + Math.floor(pct) + "%";
    }
  }
  return URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
}
go.addEventListener("click", async () => {
  try {
    url = url || await load();
    v.src = url; v.muted = MUTE;
    v.style.display = "block"; cover.style.display = "none"; bar.style.display = "none";
    if (!MUTE) v.play().catch(() => {});
    note.textContent = "Loaded. Use the player controls to pause, scrub or go full screen.";
  } catch (e) {
    go.disabled = false; go.textContent = "▶ Try again"; bar.style.display = "none";
    note.textContent = "The video couldn't load (" + e.message + "). Check your connection and try again.";
  }
});
</script>
</body>
</html>
